name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate project
        run: make generate

      # Non-blocking for now: the code base predates strict lint (255
      # violations at the time of writing), and a red lint step used to skip
      # the tests entirely. Burn the violations down, then drop this flag.
      - name: Lint
        run: make lint
        continue-on-error: true

      - name: Test
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log

      # Failures and compile errors de-duplicated at the end of the log, so a
      # red run is diagnosable from the tail of the job output alone.
      - name: Test failures
        if: failure()
        run: grep -E "error:|✘|failed" test.log | sed 's|.*/hallelujah_native_ios/||' | sort -u | head -150

  # Compile check kept independent of `lint-and-test`: lint runs first there
  # and fails the job before any Swift is compiled, so a lint failure would
  # otherwise hide real build errors. Needs the iOS 26 SDK (Liquid Glass and
  # CarPlay iOS 26 APIs), hence the macOS 26 runner.
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Build
        run: |
          set -o pipefail
          make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO" 2>&1 | tee build.log

      # Last in the log on purpose: the compile errors, de-duplicated, so a
      # failed run is diagnosable from the tail of the job output alone.
      - name: Compile errors
        if: failure()
        run: grep -E "error:" build.log | sed 's|.*/hallelujah_native_ios/||' | sort -u | head -150
