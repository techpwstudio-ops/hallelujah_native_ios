name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate project
        run: make generate

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Compile check kept independent of `lint-and-test`: lint runs first there
  # and fails the job before any Swift is compiled, so a lint failure would
  # otherwise hide real build errors. Needs the iOS 26 SDK (Liquid Glass and
  # CarPlay iOS 26 APIs), hence the macOS 26 runner.
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Build
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
