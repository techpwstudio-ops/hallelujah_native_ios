name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate project
        run: make generate

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Compile check kept independent of `lint-and-test`: lint runs first there
  # and fails the job before any Swift is compiled, so a lint failure would
  # otherwise hide real build errors. Needs the iOS 26 SDK (Liquid Glass and
  # CarPlay iOS 26 APIs), hence the macOS 26 runner.
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Build
        run: |
          set -o pipefail
          make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO" 2>&1 | tee build.log

      # Last in the log on purpose: the compile errors, de-duplicated, so a
      # failed run is diagnosable from the tail of the job output alone.
      - name: Compile errors
        if: failure()
        run: grep -E "error:" build.log | sed 's|.*/hallelujah_native_ios/||' | sort -u | head -150
